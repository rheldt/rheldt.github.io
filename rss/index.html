<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

      <span class="site-title">DevURLs++</span>
